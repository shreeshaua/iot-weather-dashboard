<!DOCTYPE html>
<html>
<head>
    <title>IoT Weather Dashboard</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #0f172a;
            color: white;
        }

        h1 {
            margin-top: 20px;
        }

        #time {
            font-size: 18px;
            margin-bottom: 20px;
            color: #38bdf8;
            line-height: 1.5;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            display: inline-block;
            width: 200px;
        }

        .good { color: #22c55e; }
        .moderate { color: #facc15; }
        .bad { color: #ef4444; }
    </style>
</head>

<body>

<h1>🌦 IoT Weather Monitoring System</h1>

<div id="time">Loading...</div>

<div class="card">
    <h2>Temperature</h2>
    <p id="temp">-- °C</p>
</div>

<div class="card">
    <h2>Humidity</h2>
    <p id="hum">-- %</p>
</div>

<div class="card">
    <h2>Air Quality</h2>
    <p id="air">--</p>
</div>

<div class="card">
    <h2>Rain</h2>
    <p id="rain">--</p>
</div>

<script>
const channelID = "3251364";

// 🕒 Date + Time
function updateTime() {
    const now = new Date();

    const options = { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
    };

    const date = now.toLocaleDateString('en-IN', options);
    const time = now.toLocaleTimeString();

    document.getElementById("time").innerHTML =
        "📅 " + date + "<br>⏰ " + time;
}

// 📡 Fetch ThingSpeak Data
async function getData() {
    const url = `https://api.thingspeak.com/channels/${channelID}/feeds/last.json`;
    const res = await fetch(url);
    const data = await res.json();

    // Temperature
    document.getElementById("temp").innerText = data.field1 + " °C";

    // Humidity
    document.getElementById("hum").innerText = data.field2 + " %";

    // Air Quality
    let aq = parseInt(data.field3);
    let aqText = "";
    let aqClass = "";

    if (aq < 40) {
        aqText = "Good 😊";
        aqClass = "good";
    } else if (aq < 70) {
        aqText = "Moderate 😐";
        aqClass = "moderate";
    } else {
        aqText = "Poor 😷";
        aqClass = "bad";
    }

    let airElem = document.getElementById("air");
    airElem.innerText = aq + " (" + aqText + ")";
    airElem.className = aqClass;

    // Rain
    let rainStatus = data.field5;
    let rainElem = document.getElementById("rain");

    if (rainStatus == "1") {
        rainElem.innerText = "Rain 🌧";
        rainElem.className = "bad";
    } else {
        rainElem.innerText = "No Rain ☀️";
        rainElem.className = "good";
    }
}

// Run functions
setInterval(updateTime, 1000);
setInterval(getData, 5000);
</script>

</body>
</html>
